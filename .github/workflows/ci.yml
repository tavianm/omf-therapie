name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs; let every main commit complete so trunk
  # signal is unambiguous (a cancelled run can't prove the commit is green).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Blocking gate — must pass to merge. All four quality gates enforced here
  # (lint, test, build, typecheck). CI build is a smoke test; Netlify rebuilds
  # from source on its own hook.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Real PostgreSQL for the integration suite (tests/integration) — the
      # revue-#149 oracle: migrations 000-local→019 applied, then the credits
      # invariants exercised under real concurrency (restore once, single
      # cancel winner). Vanilla postgres + supabase/local/000_local_compat.sql
      # (auth stub + roles) applied by the test itself.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omf_therapie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit prod dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Verify google-auth-library dedupe
        # Guard against a future googleapis bump silently re-splitting
        # google-auth-library, which re-introduces the ts2322/2769 overload
        # cascade cleared in #86. Fails loudly if more than one distinct
        # version resolves. (Count distinct versions, not install paths —
        # the same version may legitimately appear at multiple tree positions
        # once npm dedupes to a single resolved copy.)
        run: |
          versions=$(npm ls google-auth-library --all --json \
            | jq -r '[.. | objects | select(has("google-auth-library")) | ."google-auth-library".version] | unique')
          echo "google-auth-library versions: $versions"
          count=$(echo "$versions" | jq 'length')
          if [ "$count" -ne 1 ]; then
            echo "Expected 1 distinct google-auth-library version, found $count"
            npm ls google-auth-library --all
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Test (PostgreSQL integration)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/omf_therapie
      - name: Build
        run: npm run build
      - name: Verify HTML non-regression gate
        # Compare the freshly built site to the versioned Astro 5 baseline.
        # A missing baseline is a setup failure (exit 2), never a skipped gate.
        run: npm run diff:html-170
      - name: Verify HTML gate failure modes
        # Companion fixtures prove the comparator itself fails closed.
        run: npm run test:html-diff-170

  # Blocking gate member — type errors fail the run. The codebase previously
  # carried 26 pre-existing type errors (auth/payments/calendar/emails) that
  # predated CI; cleared in #86. This job now blocks merges alongside `build`.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
